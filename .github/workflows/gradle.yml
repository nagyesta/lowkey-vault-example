# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        module: [ java-sdk, spring, spring-tc, micronaut-tc, quarkus-tc ]
        include:
          - module: java-sdk
            name: Java SDK with Testcontainers
            jdk: 17
            folder: java-sdk
          - module: spring
            name: Spring Boot Azure Starter
            jdk: 17
            folder: spring-cloud-azure-starter
          - module: spring-tc
            name: Spring Boot Azure Starter Testcontainers
            jdk: 17
            folder: spring-cloud-azure-starter-testcontainers
          - module: micronaut-tc
            name: Micronaut Testcontainers
            jdk: 25
            folder: micronaut-testcontainers
          - module: quarkus-tc
            name: Quarkus Testcontainers
            jdk: 17
            folder: quarkus-testcontainers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Prepare docker
        run: echo api.version=1.44 >> ~/.docker-java.properties
      - name: Build with Gradle using ${{ matrix.name }}
        working-directory: ${{ matrix.folder }}
        run: ./gradlew test
